# CI: build, typecheck, and test on every PR into dev/master, plus a secret scan.
#
# Release PRs (dev -> master) are covered by the pull_request trigger on
# master: they run the full regression from a clean `npm ci`, as required by
# the Testing policy in AGENTS.md.
#
# No repository secrets are passed to the build jobs. Tests use mocked HTTP and
# the dummy key `test-key`; they never need FUTURE_API_KEY.
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines allows >=18, but Node 18 is EOL, so CI covers 20, 22, and 24.
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Full regression from a clean install (AGENTS.md, Testing policy).
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      # Uses .gitleaks.toml at the repo root. This repo is on a personal
      # account, so gitleaks-action needs no GITLEAKS_LICENSE. GITHUB_TOKEN is
      # the built-in, read-only (contents: read) token used to read PR commits.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
